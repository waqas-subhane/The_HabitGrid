<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabitGrid & Goal Master</title>
    <meta name="description" content="Gamified daily goals tracker with interactive spreadsheet habit matrix, visual analytics, notifications, exportable reports, dark mode, and secure user auth." />
    <script>
      // Gracefully prevent benign Vite websocket / HMR errors in sandboxed environments
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('vite') !== -1
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event.message || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('[vite]') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
